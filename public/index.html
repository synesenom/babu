<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Babu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 16px;
      padding-top: env(safe-area-inset-top, 16px);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: #8b949e;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 12px;
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: #1c2128;
      border: 1px solid #30363d;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #484f58;
    }
    .status-dot.idle { background: #484f58; }
    .status-dot.running { background: #3fb950; animation: pulse 2s infinite; }
    .status-dot.transitioning { background: #d29922; animation: pulse 1s infinite; }
    .status-dot.done { background: #58a6ff; }
    .status-dot.error { background: #f85149; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Vitals */
    .vitals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .vital {
      text-align: center;
    }
    .vital-value {
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .vital-value.hr { color: #f85149; }
    .vital-value.o2 { color: #58a6ff; }
    .vital-value.bat { color: #3fb950; }
    .vital-label {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }

    .vital-small {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      font-size: 13px;
      color: #8b949e;
    }
    .vital-small span { display: flex; align-items: center; gap: 4px; }

    /* Music */
    .now-playing {
      font-size: 15px;
      color: #e6edf3;
    }
    .now-playing .artist {
      font-size: 13px;
      color: #8b949e;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-start {
      background: #238636;
      color: #fff;
    }
    .btn-stop {
      background: #da3633;
      color: #fff;
      margin-top: 8px;
    }
    .btn-spotify {
      background: #1db954;
      color: #fff;
    }

    /* Log */
    .log {
      max-height: 160px;
      overflow-y: auto;
      font-size: 12px;
      font-family: 'SF Mono', SFMono-Regular, monospace;
      color: #8b949e;
      line-height: 1.6;
    }
    .log-entry { border-bottom: 1px solid #21262d; padding: 2px 0; }
    .log-entry .time { color: #484f58; }
    .log-entry.error { color: #f85149; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Babu</h1>

  <!-- Status -->
  <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
    <div class="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
    <span id="timestamp" style="font-size:12px; color:#484f58;"></span>
  </div>

  <!-- Spotify auth prompt -->
  <div class="card hidden" id="spotify-auth-card">
    <p style="font-size:14px; color:#8b949e; margin-bottom:12px;">Spotify not connected.</p>
    <a href="auth/spotify" class="btn btn-spotify" style="text-align:center; text-decoration:none; display:block;">Connect Spotify</a>
  </div>

  <!-- Vitals -->
  <div class="card" id="vitals-card">
    <div class="card-title">Vitals</div>
    <div class="vitals-grid">
      <div class="vital">
        <div class="vital-value hr" id="hr">--</div>
        <div class="vital-label">Heart Rate</div>
      </div>
      <div class="vital">
        <div class="vital-value o2" id="o2">--</div>
        <div class="vital-label">Oxygen %</div>
      </div>
    </div>
    <div class="vital-small">
      <span id="battery">Battery: --</span>
      <span id="movement">Movement: --</span>
      <span id="sock">Sock: --</span>
    </div>
  </div>

  <!-- Music -->
  <div class="card">
    <div class="card-title">Now Playing</div>
    <div class="now-playing">
      <div id="track-name">--</div>
      <div class="artist" id="track-artist"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="card">
    <button class="btn btn-start" id="start-btn" onclick="startRoutine()">Start Routine</button>
    <button class="btn btn-stop hidden" id="stop-btn" onclick="stopRoutine()">Stop Routine</button>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="card-title">Log</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const $hr = document.getElementById('hr');
    const $o2 = document.getElementById('o2');
    const $battery = document.getElementById('battery');
    const $movement = document.getElementById('movement');
    const $sock = document.getElementById('sock');
    const $trackName = document.getElementById('track-name');
    const $trackArtist = document.getElementById('track-artist');
    const $statusDot = document.getElementById('status-dot');
    const $statusText = document.getElementById('status-text');
    const $timestamp = document.getElementById('timestamp');
    const $startBtn = document.getElementById('start-btn');
    const $stopBtn = document.getElementById('stop-btn');
    const $spotifyAuth = document.getElementById('spotify-auth-card');
    const $log = document.getElementById('log');

    function addLog(msg, isError) {
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry' + (isError ? ' error' : '');
      entry.innerHTML = `<span class="time">${time}</span> ${msg}`;
      $log.prepend(entry);
      // Keep log manageable
      while ($log.children.length > 50) $log.removeChild($log.lastChild);
    }

    function updateStatus(state, message) {
      $statusDot.className = 'status-dot ' + state;
      $statusText.textContent = message || state;

      const isRunning = state === 'running' || state === 'transitioning';
      $startBtn.classList.toggle('hidden', isRunning || state === 'done');
      $stopBtn.classList.toggle('hidden', !isRunning);
      $startBtn.disabled = false;
    }

    function updateReading(data) {
      $hr.textContent = data.heart_rate ?? '--';
      $o2.textContent = data.oxygen ?? '--';
      $battery.textContent = `Battery: ${data.battery ?? '--'}%`;
      $movement.textContent = `Movement: ${data.movement ?? '--'}`;
      $sock.textContent = `Sock: ${data.sock_off ? 'Off' : 'On'}`;
      $timestamp.textContent = data.timestamp || '';
    }

    // Base path for all API calls (derived from the page URL)
    const BASE = window.location.pathname.replace(/\/+$/, '');

    // SSE connection
    const evtSource = new EventSource(BASE + '/api/events');

    evtSource.addEventListener('status', (e) => {
      const data = JSON.parse(e.data);
      updateStatus(data.state, data.message);
      addLog(data.message);
    });

    evtSource.addEventListener('reading', (e) => {
      const data = JSON.parse(e.data);
      updateReading(data);
      addLog(`HR: ${data.heart_rate} | O2: ${data.oxygen}% | Battery: ${data.battery}%`);
    });

    evtSource.addEventListener('error', (e) => {
      try {
        const data = JSON.parse(e.data);
        addLog(data.message, true);
      } catch {
        addLog('Connection error', true);
      }
    });

    evtSource.onopen = () => {
      addLog('Connected to server');
      fetchStatus();
    };

    // API calls
    async function fetchStatus() {
      try {
        const resp = await fetch(BASE + '/api/status');
        const data = await resp.json();
        updateStatus(data.routine_state, data.routine_state);
        if (data.last_reading) updateReading(data.last_reading);
        $spotifyAuth.classList.toggle('hidden', data.spotify_authenticated);
      } catch {
        updateStatus('error', 'Cannot reach server');
      }
    }

    async function startRoutine() {
      $startBtn.disabled = true;
      $startBtn.textContent = 'Starting...';
      try {
        const resp = await fetch(BASE + '/api/routine/start', { method: 'POST' });
        const data = await resp.json();
        if (!data.ok) {
          addLog(data.message, true);
          $startBtn.disabled = false;
          $startBtn.textContent = 'Start Routine';
        }
      } catch (err) {
        addLog('Failed to start: ' + err.message, true);
        $startBtn.disabled = false;
        $startBtn.textContent = 'Start Routine';
      }
    }

    async function stopRoutine() {
      await fetch(BASE + '/api/routine/stop', { method: 'POST' });
    }

    // Initial load
    fetchStatus();
  </script>
</body>
</html>
