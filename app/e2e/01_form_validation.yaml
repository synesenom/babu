appId: com.enysmones.babu
---
- launchApp:
    clearState: true
# Cold boot on the CI emulator (software rendering, 2 cores) can outlast
# Maestro's default ~17s wait, so the first assertion gets more room.
- assertVisible:
    text: "babu"
    timeout: 45000
- tapOn:
    id: "start-routine-button"   # disabled — should not navigate
- assertNotVisible: "Monitoring"
- tapOn:
    id: "connect-spotify-button"
- assertVisible: "Connected"
- tapOn:
    id: "start-routine-button"
- assertVisible:
    id: "status-text"
