# Verifies: Setup → Monitoring (shows vitals) → auto-advance to Done
# Requires mock mode APK: MOCK_MODE=1 npx expo run:android
appId: com.enysmones.babu
---
- launchApp:
    clearState: true
- tapOn:
    id: "connect-spotify-button"
- assertVisible: "Connected"
- tapOn:
    id: "start-routine-button"
- assertVisible:
    id: "status-text"
- extendedWaitUntil:
    visible: "TRANSITIONING"
    timeout: 10000
- extendedWaitUntil:
    visible: "Your baby is asleep"
    timeout: 10000
