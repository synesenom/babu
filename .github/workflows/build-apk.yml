name: Build APK

# Builds a standalone, installable Android APK and attaches it to a GitHub
# Release so it can be downloaded straight to a phone — no Mac build needed.
#
# Trigger it manually from the Actions tab (Run workflow). The release build
# type generated by `expo prebuild` is already signed with the debug keystore,
# so the APK installs via sideloading without any keystore setup.
#
# Optional repository secret (Settings → Secrets and variables → Actions):
#   SPOTIFY_CLIENT_ID
# If unset, the app builds but Spotify auth will not work. There is no client
# secret — the app uses the PKCE public-client flow, so nothing sensitive is
# baked into the distributed APK.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # No `cache: gradle` here: it hashes the project's Gradle files to
          # build its key, and android/ does not exist yet — `expo prebuild`
          # generates it further down. The explicit cache step below keys off
          # the prebuild's *inputs* instead, which do exist at this point.

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # android/ is regenerated on every run, so the cache is keyed on what
          # determines its contents: the locked dependency tree and the Expo
          # config that prebuild renders the Gradle project from.
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/app.json', 'app/app.config.js') }}
          # A partial hit is worth a lot here: most of a cold build is resolving
          # and downloading the React Native and AndroidX artifacts, which rarely
          # change between two runs even when the key does.
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Enable the Gradle build cache
        # Written to GRADLE_USER_HOME rather than the project, because the
        # project's gradle.properties is generated by prebuild and would be
        # overwritten. Home-level properties also take precedence over the
        # project's, so this survives whatever the Expo template renders.
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          MOCK_MODE=0
          EOF

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android

      - name: Stage APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="babu-v${VERSION}-${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=app/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Babu v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Standalone debug-signed APK built from `${{ github.sha }}`.
            Download `${{ steps.apk.outputs.name }}` below and open it on your
            Android phone to install (enable "install from unknown sources").
          files: ${{ steps.apk.outputs.path }}
