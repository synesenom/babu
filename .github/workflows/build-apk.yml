name: Build APK

# Builds a standalone, installable Android APK and attaches it to a GitHub
# Release so it can be downloaded straight to a phone — no Mac build needed.
#
# Trigger it manually from the Actions tab (Run workflow). The release build
# type generated by `expo prebuild` is already signed with the debug keystore,
# so the APK installs via sideloading without any keystore setup.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
# If unset, the app builds but Spotify auth will not work.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MOCK_MODE=0
          EOF

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android

      - name: Stage APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="babu-v${VERSION}-${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=app/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Babu v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Standalone debug-signed APK built from `${{ github.sha }}`.
            Download `${{ steps.apk.outputs.name }}` below and open it on your
            Android phone to install (enable "install from unknown sources").
          files: ${{ steps.apk.outputs.path }}
