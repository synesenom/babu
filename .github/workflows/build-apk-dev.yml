name: Build Dev APK

# Builds a standalone, installable Android APK with MOCK_MODE=1 baked in and
# attaches it to a GitHub Release so it can be downloaded straight to a
# phone — no laptop needed. This is the dev/mock counterpart to
# build-apk.yml; it never touches that workflow's tag or filename
# namespace, so a dev build can't be mistaken for (or overwrite) a real
# release.
#
# Trigger it manually from the Actions tab (Run workflow). The release build
# type generated by `expo prebuild` is already signed with the debug keystore,
# so the APK installs via sideloading without any keystore setup.
#
# No repository secrets are needed: MOCK_MODE stubs the Spotify OAuth flow
# entirely (SetupScreen uses a mock-connect button instead), so
# SPOTIFY_CLIENT_ID is irrelevant to this build.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # No `cache: gradle` here: the android/ project is generated later by
          # `expo prebuild`, so at this point there are no Gradle files to hash
          # for a cache key and the cache step would fail.

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          cat > .env <<EOF
          MOCK_MODE=1
          EOF

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android

      - name: Stage APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="babu-dev-v${VERSION}-${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=app/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: Babu DEV v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          body: |
            Standalone debug-signed APK built from `${{ github.sha }}` with
            **MOCK_MODE=1** — Spotify auth is stubbed and the Setup screen
            shows the "Sleep after (seconds)" dev-timer field. Not for real
            use with an Owlet device.

            Download `${{ steps.apk.outputs.name }}` below and open it on your
            Android phone to install (enable "install from unknown sources").
          files: ${{ steps.apk.outputs.path }}
